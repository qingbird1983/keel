# CI —— 门禁流水线（TypeScript / pnpm workspace，与 docs/standards/04 §1 表格一致）
# 门禁组合：格式化检查 / lint（error 级，--max-warnings 0）/ 类型检查 / 构建 / 测试 / check-size（体量哨兵）。
# 仓库启用 git 并配置远端后本流水线才实际触发；本地命令与 CI 完全一致（standards/05 §5）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 环境准备：Node 22 + pnpm（版本由 package.json packageManager 锁定）──
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ── 门禁（与本地 `pnpm <script>` 一致）─────────────────
      - name: fmt（格式化检查）
        run: pnpm format:check
      - name: lint（硬门槛）
        run: pnpm lint
      - name: typecheck（strict）
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
      - name: check-size（体量哨兵）
        run: bash scripts/check-size
